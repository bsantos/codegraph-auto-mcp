<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="CodeGraph: a code node-graph stored in a database, traversed at speed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a38"/>
      <stop offset="1" stop-color="#060b1a"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4d78"/>
      <stop offset="1" stop-color="#0d2a4a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="node" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#cffafe"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="27" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="26" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2"/>

  <!-- graph: dominant element -->
  <g stroke="#38bdf8" stroke-width="2.2" stroke-opacity="0.7" stroke-linecap="round">
    <path d="M50 44 L22 22"/>
    <path d="M50 44 L86 20"/>
    <path d="M50 44 L18 58"/>
    <path d="M50 44 L44 80"/>
    <path d="M50 44 L84 52"/>
    <path d="M86 20 L110 42"/>
    <path d="M110 42 L84 52"/>
    <path d="M110 42 L104 70"/>
    <path d="M84 52 L104 70"/>
    <path d="M22 22 L18 58"/>
    <path d="M18 58 L44 80"/>
    <path d="M44 80 L70 82"/>
    <path d="M70 82 L84 52"/>
  </g>
  <g fill="url(#node)" stroke="#08101f" stroke-width="2">
    <circle cx="50" cy="44" r="15"/>
    <circle cx="86" cy="20" r="10"/>
    <circle cx="18" cy="58" r="9"/>
    <circle cx="44" cy="80" r="7.5"/>
    <circle cx="22" cy="22" r="7"/>
    <circle cx="84" cy="52" r="6.5"/>
    <circle cx="70" cy="82" r="5.5"/>
    <circle cx="110" cy="42" r="5.5"/>
    <circle cx="104" cy="70" r="5"/>
  </g>

  <!-- bottom-left: indexes source code only -->
  <g fill="none" stroke="#60a5fa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9">
    <path d="M24 99.5 L19 105.5 L24 111.5"/>
    <path d="M36 99.5 L41 105.5 L36 111.5"/>
    <path d="M32.5 98.5 L27.5 112.5"/>
  </g>

  <!-- bottom-center: execution speed / token economy -->
  <path d="M10 0 L0 12 L6 12 L3 22 L13 9 L7 9 Z" transform="translate(60 95.6) scale(0.9)" fill="url(#bolt)"/>

  <!-- bottom-right: stored in a database -->
  <path d="M89.5 97 L89.5 114 A10.5 4 0 0 0 110.5 114 L110.5 97 Z" fill="#38bdf8" fill-opacity="0.1"/>
  <path d="M89.5 97 L89.5 114 A10.5 4 0 0 0 110.5 114 L110.5 97" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="100" cy="97" rx="10.5" ry="4" fill="url(#disc)" stroke="#38bdf8" stroke-width="2.4"/>
  <path d="M89.5 104 A10.5 4 0 0 0 110.5 104" fill="none" stroke="#38bdf8" stroke-width="1.7" stroke-opacity="0.5" stroke-linecap="round"/>

</svg>
